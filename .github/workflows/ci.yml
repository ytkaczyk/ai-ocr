name: CI

on:
  push:
    branches: ['main', '001-ocr-translation-viewer']
  pull_request:
    branches: ['main']
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # Security audit job (T116a - FR-033)
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: apps/web-viewer
        continue-on-error: false  # Fail build on high/critical vulnerabilities

  # Snyk security scanning (T116b - FR-033)
  snyk-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: false  # Fail build on vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=apps/web-viewer/package.json
          command: test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Run ESLint
        run: npm run lint
        working-directory: apps/web-viewer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Create test data directory
        run: |
          mkdir -p apps/web-viewer/data/kombucha/en-US
          mkdir -p apps/web-viewer/data/kombucha/fr-FR
          echo "# Test Page 1" > apps/web-viewer/data/kombucha/en-US/kombucha.en-US_page_1.md
          echo "# Page de test 1" > apps/web-viewer/data/kombucha/fr-FR/kombucha.fr-FR_page_1.md
        working-directory: .
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: apps/web-viewer
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./apps/web-viewer/coverage/coverage-final.json
          flags: unittests
          name: codecov-web-viewer
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check coverage threshold (70% minimum)
        run: |
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage is below 70% threshold"
            exit 1
          fi
          echo "Coverage check passed: $COVERAGE% >= 70%"
        working-directory: apps/web-viewer

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Build project
        run: npm run build
        working-directory: apps/web-viewer

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/web-viewer
      - name: Create test data directory structure
        run: |
          mkdir -p data/kombucha/en-US
          mkdir -p data/kombucha/fr-FR
          mkdir -p data/kombucha/raw.en-US
          mkdir -p data/kombucha/raw.fr-FR
          # Create sample markdown files for testing
          echo "# Test Page 1 - English" > data/kombucha/en-US/kombucha.en-US_page_1.md
          echo "# Test Page 2 - English" > data/kombucha/en-US/kombucha.en-US_page_2.md
          echo "# Page de test 1 - Français" > data/kombucha/fr-FR/kombucha.fr-FR_page_1.md
          echo "# Page de test 2 - Français" > data/kombucha/fr-FR/kombucha.fr-FR_page_2.md
          echo "# Raw Page 1 - English" > data/kombucha/raw.en-US/kombucha.raw.en-US_page_1.md
          echo "# Raw Page 1 - Français" > data/kombucha/raw.fr-FR/kombucha.raw.fr-FR_page_1.md
        working-directory: apps/web-viewer
      - name: Copy test PDF files
        run: |
          # Copy actual test PDFs from data directory if they exist
          if [ -d "../../examples/kombucha" ]; then
            cp -r ../../examples/kombucha/* data/kombucha/ 2>/dev/null || true
          fi
        working-directory: apps/web-viewer
      - name: Create .env file for E2E tests
        run: |
          echo "DATA_FOLDER_PATH=${{ github.workspace }}/apps/web-viewer/data" > .env.local
          echo "MAX_PDF_SIZE_MB=100" >> .env.local
        working-directory: apps/web-viewer
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: apps/web-viewer

  # Lighthouse CI for performance testing (T126a - SC-001)
  lighthouse-ci:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-viewer
      - name: Build project
        run: npm run build
        working-directory: apps/web-viewer
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Lighthouse CI
        run: lhci autorun
        working-directory: apps/web-viewer
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
